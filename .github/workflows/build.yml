name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test SshTunneler.slnx -c Release

  macos:
    # Apple Silicon runner, the same CPU family the app is built for.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test SshTunneler.slnx -c Release
      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=1.0.0" >> "$GITHUB_OUTPUT"
          fi
      - name: Build app and disk image
        # Through the environment, never pasted into the script: a tag name is untrusted text.
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: bash installer/build-macos.sh "$VERSION" osx-arm64
      # The .dmg keeps the bundle's permissions and signature; a bare .app would lose them
      # in the artifact zip.
      - uses: actions/upload-artifact@v7
        with:
          name: SshTunneler-osx-arm64
          path: artifacts/*.dmg
          if-no-files-found: error
